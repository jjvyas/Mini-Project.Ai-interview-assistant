<!DOCTYPE html>
<html LANG = 'EN'>
    <head META CHARSET = 'UTF-8'>
        <TITLE>My Web Page</TITLE>
        <style>
           body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            
            /* Radiant blue gradient */
            background: linear-gradient(135deg, #1E90FF, #00BFFF, #87CEFA);
            color: white;
            text-align: center;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px #00000050;
        }

        button {
            font-size: 1.5em;
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            background-color: #00BFFF;
            color: white;
            cursor: pointer;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #1E90FF;
            transform: scale(1.1);
        }
      </style>
    </head>
    <body>
        <H1 style = 'text-align: center; color: blue;'>Welcome to My Web Page</H1><hr>
        <P style = 'font-size: 16px; color: black;'>Welcome to Ai enabled interview coach. Here you can test your interviewing skills accompanied by a user friendly Ai which interprets your mock tests and gives you suggestions and feedback improving your interviewing skills </P>
        <button id="record-btn">🎤 Record Answer</button>

    <script>
        const button = document.getElementById("record-btn");
        button.onclick = () => {
            alert("Mic recording will start here (next step)");
        };
    </script>
    </body>
</html>
